<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#0d1b2a" id="theme-meta">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>€ · Coronas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── DARK (default) ── */
    :root, [data-theme="dark"] {
      --bg:      #0d1b2a;
      --surface: #1b2838;
      --card:    #162032;
      --input-bg:#0a1420;
      --border:  #2a3f55;
      --text:    #e8f0f7;
      --muted:   #7a9ab5;
      --shadow:  rgba(0,0,0,.35);
      --toggle-bg: #1b2838;
    }

    /* ── LIGHT ── */
    [data-theme="light"] {
      --bg:      #f0f4f8;
      --surface: #ffffff;
      --card:    #ffffff;
      --input-bg:#f7fafc;
      --border:  #c9d8e8;
      --text:    #1a2a3a;
      --muted:   #5a7a9a;
      --shadow:  rgba(0,0,0,.10);
      --toggle-bg: #e2ecf5;
    }

    /* ── SHARED ACCENT COLOURS (unchanged between themes) ── */
    :root {
      --eur-c: #4a9eff;
      --nok-c: #e63946;
      --sek-c: #e07b2a;
      --dkk-c: #1aa89d;
      --gold:  #d4960a;
      --radius: 14px;
      --font-num: 'Courier New', Courier, monospace;
    }

    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100svh; display: flex; flex-direction: column;
      align-items: center; padding: 18px 14px 48px;
      transition: background .25s, color .25s;
    }

    /* ── HEADER ── */
    header {
      text-align: center; margin-bottom: 14px;
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .flags { font-size: 1.9rem; letter-spacing: 3px; margin-bottom: 5px; }
    h1 { font-size: 0.95rem; font-weight: 500; color: var(--muted);
         letter-spacing: 0.14em; text-transform: uppercase; }

    /* ── THEME TOGGLE ── */
    .toggle-wrap {
      position: absolute; right: 0; top: 4px;
    }
    .toggle-btn {
      background: var(--toggle-bg); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 10px;
      font-size: 1rem; cursor: pointer; line-height: 1;
      transition: background .2s, border-color .2s;
      display: flex; align-items: center; gap: 4px;
      color: var(--text);
    }
    .toggle-btn:active { opacity: .7; }
    #theme-label { font-size: 0.65rem; color: var(--muted); font-weight: 600; letter-spacing:.05em; }

    /* ── STATUS BAR ── */
    .status-bar {
      display: flex; align-items: center; gap: 8px;
      background: var(--card); border: 1px solid var(--border);
      box-shadow: 0 1px 4px var(--shadow);
      border-radius: 30px; padding: 7px 14px; margin-bottom: 16px;
      font-size: 0.78rem; color: var(--muted);
      max-width: 420px; width: 100%;
      transition: background .25s, border-color .25s;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .dot.ok      { background: #2ecc71; animation: pulse 2.5s infinite; }
    .dot.err     { background: var(--nok-c); }
    .dot.loading { background: var(--gold); animation: spin .9s linear infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
    @keyframes spin  { to { transform: rotate(360deg); } }
    #status-msg { flex: 1; font-size: 0.75rem; }
    .btn-refresh {
      background: none; border: 1px solid var(--border); border-radius: 20px;
      color: var(--muted); font-size: 0.72rem; padding: 3px 10px; cursor: pointer;
      transition: color .2s, border-color .2s; white-space: nowrap;
    }
    .btn-refresh:hover { color: var(--text); border-color: var(--text); }
    .spin { display:inline-block; animation: spin .9s linear infinite; }

    /* ── CURRENCY CARDS ── */
    .cards { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 420px; }

    .curr-card {
      background: var(--card); border: 2px solid var(--border);
      border-radius: var(--radius); padding: 13px 15px;
      position: relative; overflow: hidden;
      box-shadow: 0 1px 6px var(--shadow);
      transition: border-color .2s, background .25s, box-shadow .2s;
    }
    .curr-card::before {
      content:''; position:absolute; left:0; top:0; bottom:0;
      width:4px; border-radius:4px 0 0 4px;
    }
    .curr-card[data-curr="EUR"]::before { background: var(--eur-c); }
    .curr-card[data-curr="NOK"]::before { background: var(--nok-c); }
    .curr-card[data-curr="SEK"]::before { background: var(--sek-c); }
    .curr-card[data-curr="DKK"]::before { background: var(--dkk-c); }

    .curr-card.active[data-curr="EUR"] { border-color: var(--eur-c); box-shadow: 0 0 0 3px rgba(74,158,255,.15); }
    .curr-card.active[data-curr="NOK"] { border-color: var(--nok-c); box-shadow: 0 0 0 3px rgba(230,57,70,.15); }
    .curr-card.active[data-curr="SEK"] { border-color: var(--sek-c); box-shadow: 0 0 0 3px rgba(224,123,42,.15); }
    .curr-card.active[data-curr="DKK"] { border-color: var(--dkk-c); box-shadow: 0 0 0 3px rgba(26,168,157,.15); }

    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; }
    .card-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--muted);
    }
    .card-flag { font-size: 1.2rem; }
    .card-rate { font-size: 0.68rem; color: var(--muted); }

    .input-wrap { position: relative; }
    .curr-input {
      width: 100%; background: var(--input-bg);
      border: 1.5px solid var(--border); border-radius: 10px;
      color: var(--text); font-family: var(--font-num);
      font-size: 2rem; font-weight: bold;
      padding: 10px 52px 10px 12px; outline: none;
      transition: border-color .2s, background .25s, color .25s;
      -moz-appearance: textfield;
    }
    .curr-input::-webkit-inner-spin-button,
    .curr-input::-webkit-outer-spin-button { -webkit-appearance: none; }
    .curr-card[data-curr="EUR"] .curr-input:focus { border-color: var(--eur-c); }
    .curr-card[data-curr="NOK"] .curr-input:focus { border-color: var(--nok-c); }
    .curr-card[data-curr="SEK"] .curr-input:focus { border-color: var(--sek-c); }
    .curr-card[data-curr="DKK"] .curr-input:focus { border-color: var(--dkk-c); }

    .curr-sym {
      position:absolute; right:12px; top:50%; transform:translateY(-50%);
      font-size:1rem; font-weight:700; color:var(--muted); pointer-events:none;
    }

    /* ── QUICK BUTTONS ── */
    .quick-row { display:flex; gap:6px; margin-top:9px; }
    .qbtn {
      flex:1; background: var(--surface); border:1px solid var(--border);
      border-radius:7px; color:var(--text); font-size:0.78rem;
      font-weight:600; padding:7px 2px; cursor:pointer; text-align:center;
      transition: background .15s, border-color .15s, color .15s;
    }
    .curr-card[data-curr="EUR"] .qbtn:active { background:var(--eur-c); border-color:var(--eur-c); color:#fff; }
    .curr-card[data-curr="NOK"] .qbtn:active { background:var(--nok-c); border-color:var(--nok-c); color:#fff; }
    .curr-card[data-curr="SEK"] .qbtn:active { background:var(--sek-c); border-color:var(--sek-c); color:#fff; }
    .curr-card[data-curr="DKK"] .qbtn:active { background:var(--dkk-c); border-color:var(--dkk-c); color:#fff; }

    /* ── FOOTER ── */
    .footer { margin-top:14px; font-size:0.67rem; color:var(--muted); text-align:center; line-height:1.8; }
    .fallback-note {
      margin-top:6px; font-size:0.65rem; color:var(--muted);
      background:var(--surface); border:1px solid var(--border);
      border-radius:8px; padding:5px 10px; display:none;
    }
    .fallback-note.visible { display:block; }
  </style>
</head>
<body>

<header>
  <div class="flags">🇪🇺 🇳🇴 🇸🇪 🇩🇰</div>
  <h1>Euros · Coronas Escandinavas</h1>
  <div class="toggle-wrap">
    <button class="toggle-btn" id="theme-btn" title="Cambiar modo">
      <span id="theme-icon">☀️</span>
      <span id="theme-label">CLARO</span>
    </button>
  </div>
</header>

<div class="status-bar">
  <div class="dot loading" id="dot"></div>
  <span id="status-msg">Conectando con ECB…</span>
  <button class="btn-refresh" id="btn-refresh"><span id="ico-refresh">↻</span> Actualizar</button>
</div>

<div class="cards" id="cards">

  <div class="curr-card active" data-curr="EUR">
    <div class="card-top">
      <div class="card-label"><span class="card-flag">🇪🇺</span> EUR — Euro</div>
      <div class="card-rate">moneda base</div>
    </div>
    <div class="input-wrap">
      <input class="curr-input" id="input-EUR" type="number" inputmode="decimal" placeholder="0" min="0" step="any">
      <span class="curr-sym">€</span>
    </div>
    <div class="quick-row">
      <button class="qbtn" data-val="10">10 €</button>
      <button class="qbtn" data-val="20">20 €</button>
      <button class="qbtn" data-val="50">50 €</button>
      <button class="qbtn" data-val="100">100 €</button>
    </div>
  </div>

  <div class="curr-card" data-curr="NOK">
    <div class="card-top">
      <div class="card-label"><span class="card-flag">🇳🇴</span> NOK — Corona noruega</div>
      <div class="card-rate" id="lbl-NOK">—</div>
    </div>
    <div class="input-wrap">
      <input class="curr-input" id="input-NOK" type="number" inputmode="decimal" placeholder="0" min="0" step="any">
      <span class="curr-sym">kr</span>
    </div>
    <div class="quick-row">
      <button class="qbtn" data-val="50">50</button>
      <button class="qbtn" data-val="100">100</button>
      <button class="qbtn" data-val="200">200</button>
      <button class="qbtn" data-val="500">500</button>
    </div>
  </div>

  <div class="curr-card" data-curr="SEK">
    <div class="card-top">
      <div class="card-label"><span class="card-flag">🇸🇪</span> SEK — Corona sueca</div>
      <div class="card-rate" id="lbl-SEK">—</div>
    </div>
    <div class="input-wrap">
      <input class="curr-input" id="input-SEK" type="number" inputmode="decimal" placeholder="0" min="0" step="any">
      <span class="curr-sym">kr</span>
    </div>
    <div class="quick-row">
      <button class="qbtn" data-val="50">50</button>
      <button class="qbtn" data-val="100">100</button>
      <button class="qbtn" data-val="200">200</button>
      <button class="qbtn" data-val="500">500</button>
    </div>
  </div>

  <div class="curr-card" data-curr="DKK">
    <div class="card-top">
      <div class="card-label"><span class="card-flag">🇩🇰</span> DKK — Corona danesa</div>
      <div class="card-rate" id="lbl-DKK">—</div>
    </div>
    <div class="input-wrap">
      <input class="curr-input" id="input-DKK" type="number" inputmode="decimal" placeholder="0" min="0" step="any">
      <span class="curr-sym">kr</span>
    </div>
    <div class="quick-row">
      <button class="qbtn" data-val="50">50</button>
      <button class="qbtn" data-val="100">100</button>
      <button class="qbtn" data-val="200">200</button>
      <button class="qbtn" data-val="500">500</button>
    </div>
  </div>

</div>

<div class="footer">Tipos del Banco Central Europeo · Se actualizan solos cada día</div>
<div class="fallback-note" id="fallback-note">⚠️ Sin conexión — usando tipos del 7/07/2026 como referencia</div>

<script>
  /* ── THEME ── */
  const html = document.documentElement;
  const themeBtn  = document.getElementById('theme-btn');
  const themeIcon = document.getElementById('theme-icon');
  const themeLabel= document.getElementById('theme-label');
  const themeMeta = document.getElementById('theme-meta');

  function applyTheme(t) {
    html.setAttribute('data-theme', t);
    if (t === 'light') {
      themeIcon.textContent  = '🌙';
      themeLabel.textContent = 'OSCURO';
      themeMeta.content      = '#f0f4f8';
    } else {
      themeIcon.textContent  = '☀️';
      themeLabel.textContent = 'CLARO';
      themeMeta.content      = '#0d1b2a';
    }
    try { localStorage.setItem('theme', t); } catch(e){}
  }

  // Leer preferencia guardada o usar preferencia del sistema
  (function initTheme() {
    let saved;
    try { saved = localStorage.getItem('theme'); } catch(e){}
    if (saved) { applyTheme(saved); return; }
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    applyTheme(prefersDark ? 'dark' : 'light');
  })();

  themeBtn.addEventListener('click', () => {
    applyTheme(html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });

  /* ── CONVERTER ── */
  const FALLBACK = { NOK: 11.2279, SEK: 11.017, DKK: 7.4746 };
  const RATES    = { EUR: 1, NOK: null, SEK: null, DKK: null };
  const CURRS    = ['EUR','NOK','SEK','DKK'];
  let activeCurr = 'EUR';
  let isUpdating = false;

  const dot       = document.getElementById('dot');
  const statusMsg = document.getElementById('status-msg');
  const icoRefresh= document.getElementById('ico-refresh');

  function inp(c) { return document.getElementById('input-' + c); }
  function lbl(c) { return document.getElementById('lbl-' + c); }
  function toEUR(v,c)   { return c==='EUR' ? v : v/RATES[c]; }
  function fromEUR(e,c) { return c==='EUR' ? e : e*RATES[c]; }

  function convertFrom(source) {
    const raw = parseFloat(inp(source).value);
    isUpdating = true;
    CURRS.forEach(c => {
      if (c === source) return;
      inp(c).value = (isNaN(raw) || inp(source).value==='')
        ? '' : parseFloat(fromEUR(toEUR(raw, source), c).toFixed(2));
    });
    isUpdating = false;
  }

  function setActive(curr) {
    activeCurr = curr;
    document.querySelectorAll('.curr-card').forEach(card =>
      card.classList.toggle('active', card.dataset.curr === curr));
  }

  function applyRates() {
    ['NOK','SEK','DKK'].forEach(c =>
      lbl(c).textContent = `1 € = ${RATES[c].toFixed(4)} kr`);
    const v = inp(activeCurr).value;
    if (v) convertFrom(activeCurr);
  }

  function useFallback() {
    Object.assign(RATES, FALLBACK);
    dot.className = 'dot err';
    statusMsg.textContent = 'Sin conexión · tipos de respaldo';
    document.getElementById('fallback-note').classList.add('visible');
    applyRates();
  }

  async function fetchRates(force = false) {
    if (!force) {
      try {
        const cached = JSON.parse(localStorage.getItem('ecb_rates') || 'null');
        if (cached && (Date.now() - cached.ts) < 12*3600*1000) {
          Object.assign(RATES, { NOK: cached.NOK, SEK: cached.SEK, DKK: cached.DKK });
          dot.className = 'dot ok';
          statusMsg.textContent = `ECB · ${new Date(cached.ts).toLocaleDateString('es-ES')} (caché)`;
          applyRates(); return;
        }
      } catch(e){}
    }
    dot.className = 'dot loading';
    statusMsg.textContent = 'Actualizando tipos ECB…';
    icoRefresh.className = 'spin';
    try {
      const res = await fetch(
        'https://api.frankfurter.dev/v1/latest?base=EUR&symbols=NOK,SEK,DKK',
        { signal: AbortSignal.timeout(8000) }
      );
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      Object.assign(RATES, { NOK: data.rates.NOK, SEK: data.rates.SEK, DKK: data.rates.DKK });
      try {
        localStorage.setItem('ecb_rates', JSON.stringify(
          { NOK: RATES.NOK, SEK: RATES.SEK, DKK: RATES.DKK, ts: Date.now() }));
      } catch(e){}
      dot.className = 'dot ok';
      const fecha = new Date(data.date).toLocaleDateString('es-ES', {day:'numeric',month:'short',year:'numeric'});
      statusMsg.textContent = `ECB · ${fecha} ✓`;
      document.getElementById('fallback-note').classList.remove('visible');
      applyRates();
    } catch(e) { useFallback(); }
    finally { icoRefresh.className = ''; }
  }

  CURRS.forEach(curr => {
    inp(curr).addEventListener('focus', () => setActive(curr));
    inp(curr).addEventListener('input', () => { if (!isUpdating) convertFrom(curr); });
  });

  document.getElementById('cards').addEventListener('click', e => {
    const btn = e.target.closest('.qbtn');
    if (!btn) return;
    const card = btn.closest('.curr-card');
    const curr = card.dataset.curr;
    setActive(curr); inp(curr).value = btn.dataset.val;
    convertFrom(curr); inp(curr).focus();
  });

  document.getElementById('btn-refresh').addEventListener('click', () => fetchRates(true));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') fetchRates();
  });

  fetchRates();
  inp('EUR').focus();
</script>
</body>
</html>
